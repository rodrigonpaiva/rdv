name: Quality and versioned artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@12.2.1
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint, types, tests, contracts, build and real PostgreSQL
        run: npm run ci:quality
      - name: Package only verified outputs and migrations
        run: npm run ci:artifact
      - name: Promote verified build bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rdv-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/rdv-*.tar.gz
            .artifacts/rdv-*.tar.gz.sha256
          include-hidden-files: true # Only the two explicit archive/checksum patterns above
          if-no-files-found: error
          retention-days: 14
